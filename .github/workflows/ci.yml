name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Automated tests and production build
        run: npm run check
      - name: Dependency security audit
        run: npm run audit
